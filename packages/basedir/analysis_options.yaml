include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    # `flutter pub get` and `flutter analyze` append these themselves, every
    # run. They are committed so the tree stays clean afterwards — delete them
    # and the next run puts them back, leaving a modified tracked file in
    # every checkout.
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    always_use_package_imports: true
    avoid_relative_lib_imports: true
    public_member_api_docs: true
    always_specify_types: true
    prefer_final_locals: true
    prefer_const_constructors: true
    unnecessary_this: true
    avoid_print: true
    directives_ordering: true
    sort_pub_dependencies: true
    sort_constructors_first: true
