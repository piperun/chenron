# ─── VERSIONING ──────────────────────────────────────────────────────────────
# Single source-of-truth version for the whole workspace = the chenron app
# version, tagged `vX.Y.Z`.
#
# The packages are unpublished (`publish_to: none`) and wired together with
# `any` internal constraints, so per-package versions were pure bookkeeping
# that drifted (e.g. a global `v1.3.0` next to `chenron-v1.14.0`). One tag +
# one changelog is the source of truth; the bump writes the version into the
# app pubspec.
#
# Use: cog bump --auto
# ─────────────────────────────────────────────────────────────────────────────

from_latest_tag = true
ignore_merge_commits = true
tag_prefix = "v"
branch_whitelist = ["main"]

# The release version lives in the chenron app pubspec.
pre_bump_hooks = [
  "sed -i 's/^version: .*/version: {{version}}+0/' apps/chenron/pubspec.yaml",
]

[commit_types]
hotfix = { changelog_title = "Hotfixes", bump_patch = true }
# Conventional Commits treats `perf` as patch-bump material — cog's default
# leaves it out, so opt in explicitly.
perf = { changelog_title = "Performance", bump_patch = true }
chore = { changelog_title = "Chores", omit_from_changelog = true }
test = { changelog_title = "Tests", omit_from_changelog = true }
ci = { changelog_title = "CI", omit_from_changelog = true }
style = { changelog_title = "Style", omit_from_changelog = true }

[changelog]
path = "CHANGELOG.md"
template = "remote"
remote = "github.com"
owner = "piperun"
repository = "chenron-flutter"

[[changelog.authors]]
signature = "piperun"
username = "piperun"

[git_hooks.pre-commit]
script = "#!/bin/sh\nset -e\nexec scripts/pre-commit.sh"

[git_hooks.pre-push]
script = "#!/bin/sh\nset -e\nexec scripts/pre-push.sh \"$@\""

[git_hooks.commit-msg]
script = "#!/bin/sh\nset -e\ncog verify --file $1"
